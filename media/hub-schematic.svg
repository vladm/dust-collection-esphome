<text class="ts" x="432" y="484" text-anchor="end">5V</text>
<text class="ts" x="380" y="520" text-anchor="middle">GND</text>
<path class="w" d="M380 530V546M372 546H388M375 550H385M378 554H382"/>

<use xlink:href="#ch" href="#ch"/>
<use xlink:href="#ch" href="#ch" y="100"/>
<use xlink:href="#ch" href="#ch" y="200"/>
<use xlink:href="#ch" href="#ch" y="300"/>
<text class="th" x="80" y="148" text-anchor="middle">ACS712 #1</text>
<text class="ts" x="80" y="165" text-anchor="middle">line 1</text>
<text class="th" x="80" y="248" text-anchor="middle">ACS712 #2</text>
<text class="ts" x="80" y="265" text-anchor="middle">line 2</text>
