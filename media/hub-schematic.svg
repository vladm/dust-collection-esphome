<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 760 580" width="760" height="580" role="img" font-family="Helvetica, Arial, sans-serif">
<title>Dust collection hub electrical schematic</title>
<desc>ESP32-C6 with four ACS712 current sensors (VCC 5 V, GND, OUT through 10k/10k dividers with 100 nF to GPIO0..GPIO3), relay module on GPIO10 switching the dust collector hot wire, collector LED on GPIO18, manual switch on GPIO19 and external switch on GPIO11, both to ground.</desc>
<style>
.th{font-size:14px;font-weight:600;fill:#222}
.ts{font-size:12px;fill:#444}
.w{fill:none;stroke:#444;stroke-width:1.2}
.esp{fill:#EEEDFE;stroke:#534AB7}
.acs{fill:#E1F5EE;stroke:#0F6E56}
.box{fill:#F1EFE8;stroke:#5F5E5A}
</style>
<defs>
<g id="ch">
<rect class="acs" x="30" y="118" width="100" height="64" rx="4"/>
<path class="w" d="M45 118V106M39 106H51"/>
<text class="ts" x="55" y="113">VCC 5 V</text>
<path class="w" d="M115 182V192M107 192H123M110 196H120M113 200H117"/>
<text class="ts" x="127" y="197">GND</text>
<path class="w" d="M130 150H150M190 150H320M215 150V160M215 190V198M207 198H223M210 202H220M213 206H217M262 150V170M254 170H270M254 176H270M262 176V198M254 198H270M257 202H267M260 206H264"/>
<rect class="w" x="150" y="144" width="40" height="12"/>
<rect class="w" x="209" y="160" width="12" height="30"/>
<circle cx="215" cy="150" r="2.5" fill="#444"/>
<circle cx="262" cy="150" r="2.5" fill="#444"/>
<text class="ts" x="170" y="138" text-anchor="middle">10k</text>
<text class="ts" x="226" y="179">10k</text>
<text class="ts" x="275" y="177">100n</text>
</g>
</defs>
<rect width="760" height="580" fill="#fff"/>

<rect class="esp" x="320" y="70" width="120" height="460" rx="6"/>
<text class="th" x="380" y="94" text-anchor="middle">ESP32-C6</text>
<text class="ts" x="328" y="154">GPIO0</text>
<text class="ts" x="328" y="254">GPIO1</text>
<text class="ts" x="328" y="354">GPIO2</text>
<text class="ts" x="328" y="454">GPIO3</text>
<text class="ts" x="432" y="114" text-anchor="end">GPIO10</text>
<text class="ts" x="432" y="224" text-anchor="end">GPIO18</text>
<text class="ts" x="432" y="324" text-anchor="end">GPIO19</text>
